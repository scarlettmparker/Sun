mutation addRemoteObject($postId: ID!, $target: String!) {
  blogMutations {
    addRemoteObject(postId: $postId, target: $target) {
      message
      post {
        id
        title
        content
        tags
        remoteObject
        language
        parentId
        type {
          id
          name
        }
        createdAt
        updatedAt
      }
    }
  }
}
