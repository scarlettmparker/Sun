query listBlogPosts($pagination: PaginationInput) {
  blogQueries {
    listBlogPosts(pagination: $pagination) {
      items {
        id
        title
        createdAt
        tags
      }
      pageInfo {
        page
        size
        totalPages
        totalCount
        hasNextPage
        hasPreviousPage
      }
    }
  }
}
