# Content-hashed bundles straight off disk, with their .gz twins when present.
# `root` is set per server to that app's dist/client.

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}

location /fonts/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}

location = /favicon.ico {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}
