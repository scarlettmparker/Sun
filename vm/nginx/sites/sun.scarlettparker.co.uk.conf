server {
    server_name sun.scarlettparker.co.uk;

    root /opt/sun/web/dist/client;
    include /etc/nginx/snippets/sun-edge.conf;
    include /etc/nginx/snippets/sun-static.conf;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        proxy_pass http://@HOST@:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/sun.scarlettparker.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sun.scarlettparker.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = sun.scarlettparker.co.uk) { return 301 https://$host$request_uri; }
    listen 80; listen [::]:80;
    server_name sun.scarlettparker.co.uk;
    return 404;
}
