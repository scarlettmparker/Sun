server {
    server_name chess-server.scarlettparker.co.uk;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    include /etc/nginx/snippets/sun-maintenance.conf;

    location / {
        proxy_pass http://@HOST@:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/chess-server.scarlettparker.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess-server.scarlettparker.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = chess-server.scarlettparker.co.uk) { return 301 https://$host$request_uri; }
    listen 80; listen [::]:80;
    server_name chess-server.scarlettparker.co.uk;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    return 404;
}
