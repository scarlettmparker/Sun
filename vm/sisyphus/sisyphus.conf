# sisyphus - self-contained Sun backend box.
#
# Postgres, Redis, Permify and the Spring GraphQL backend all run inside the
# container, so the whole request path can be profiled off one machine.

# --- identity ---------------------------------------------------------------
NAME=sisyphus
IMAGE=images:debian/13
AUTOSTART=false

# --- storage (hard capped) --------------------------------------------------
POOL=sisyphus
POOL_IMG=/srv/incus-sisyphus.img
POOL_DIR=/srv/incus-sisyphus
STORAGE_SIZE=10G

# --- networking -------------------------------------------------------------
# Reuses cassini's managed Incus bridge, which already has DHCP/DNS off (pihole
# owns the host's :53 and :67).
BRIDGE=incusbr0
BRIDGE_CIDR=10.99.0.1/24
CONTAINER_IP=10.99.0.6/24
GATEWAY=10.99.0.1
DNS=192.168.0.106
DNS_ALT=1.1.1.1
HOST_PORT=9180
CONTAINER_PORT=8083
# Name the browser uses. Added to the host's /etc/hosts as 127.0.0.1.
HOST_ALIAS=sisyphus

# --- "hardware" -------------------------------------------------------------
LIMITS_CPU=1
MEMORY=512MiB
SWAP_LIMIT=512M

# --- backend ----------------------------------------------------------------
# AUTH=off bypasses permissions, rate limiting, ip whitelisting, audit and the
# permify client so the GraphQL/DB path is the only thing under test.
AUTH=off
JVM_XMS=32m
JVM_XMX=192m
JVM_METASPACE=160m
JVM_CPUS=1
JVM_GC=serial
JVM_CDS=on
NMT=off
COMPACT_HEADERS=on
VIRTUAL_THREADS=off

MODULES=full

# --- services ---------------------------------------------------------------
APP_DIR=/opt/sun/backend
PERMIFY_DIR=/opt/permify
PERMIFY_VERSION=v1.7.3
