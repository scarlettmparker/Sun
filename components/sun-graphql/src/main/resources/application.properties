spring.application.name=sun-graphql
spring.main.allow-bean-definition-overriding=true

# Shared database - all components live in this single Postgres database.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Redis (session persistence survives restarts)
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

# Base URL for emailed links (password reset, account reactivation).
app.base-url=${APP_BASE_URL:http://localhost:5178}

# Hades
hades.hide-threshold=-3

# Discord OAuth
discord.client-id=${DISCORD_CLIENT_ID:}
discord.client-secret=${DISCORD_CLIENT_SECRET:}
discord.guild-id=${DISCORD_GUILD_ID:}
discord.redirect-uri=${DISCORD_REDIRECT_URI:}
discord.bot-token=${DISCORD_BOT_TOKEN:}

# Email (Gmail SMTP XOAUTH2)
EMAIL_HOST=smtp.gmail.com
EMAIL_PORT=465
EMAIL_OAUTH=oauth2.googleapis.com

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway setup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# Torrent search (Jackett)
torrent-search.jackett-url=https://jackett.int.scarlettparker.co.uk
torrent-search.jackett-api-key=${JACKETT_API_KEY:}

# Audit
audit.enabled=${AUDIT_ENABLED:true}
audit.chain.key=${AUDIT_CHAIN_KEY:}
# Without this, Spring Boot's default CamelCaseToUnderscores would create mismatched audit columns in the db.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# HikariCP connection pool
spring.datasource.hikari.pool-name=sun-hikari
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000

# Tomcat worker pool + connector limits
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=10000
server.tomcat.accept-count=200
server.tomcat.connection-timeout=20000
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=30s,maximumSize=1000
sun.graphql.max-body-bytes=1048576

server.port=8083

# GraphQL Configuration
graphql.servlet.mapping=/graphql
graphql.servlet.enabled=true
graphql.servlet.corsEnabled=false

# Module toggles (set to false in .env to disable a module)
dionysus.enabled=${DIONYSUS_ENABLED:true}
briareus.enabled=${BRIAREUS_ENABLED:true}
cerberus.enabled=${CERBERUS_ENABLED:true}
apollo.enabled=${APOLLO_ENABLED:true}
hades.enabled=${HADES_ENABLED:true}
fates.enabled=${FATES_ENABLED:true}
echo.enabled=${ECHO_ENABLED:true}
icarus.enabled=${ICARUS_ENABLED:true}
jocasta.enabled=${JOCASTA_ENABLED:true}
narcissus.enabled=${NARCISSUS_ENABLED:true}

# Per-app client secrets.
client.secrets.guided-reader=${GUIDED_READER_CLIENT_SECRET:}
client.secrets.checklist=${CHECKLIST_CLIENT_SECRET:}
client.secrets.viewer=${VIEWER_CLIENT_SECRET:}
client.secrets.filestore=${FILESTORE_CLIENT_SECRET:}
client.secrets.niece-scarlett=${NIECE_SCARLETT_CLIENT_SECRET:}
client.secrets.sun=${SUN_CLIENT_SECRET:}
client.secrets.emulator=${EMULATOR_CLIENT_SECRET:}

# Rate limiting (token bucket per IP/account).
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
ratelimit.default-capacity=${RATELIMIT_DEFAULT_CAPACITY:200}

# Permify
permify.enabled=true
permify.http-endpoint=http://localhost:3477
ratelimit.default-refill-per-second=${RATELIMIT_DEFAULT_REFILL:20}
ip-whitelist.enabled=${IP_WHITELIST_ENABLED:true}
ip-whitelist.excluded-paths=/api/public

# CEFR inference service (managed Python process)
cefr.inference.enabled=${CEFR_INFERENCE_ENABLED:false}
cefr.inference.python=${CEFR_INFERENCE_PYTHON:}
cefr.inference.dir=${CEFR_INFERENCE_DIR:}
cefr.inference.port=${CEFR_INFERENCE_PORT:8084}
cefr.inference.startup-timeout-ms=${CEFR_INFERENCE_STARTUP_TIMEOUT_MS:120000}
cefr.inference.health-check-ms=${CEFR_INFERENCE_HEALTH_CHECK_MS:30000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
