when:
  - event: [push, manual]
    branch: main

steps:
  build-frontend:
    image: oven/bun:1.4.3
    volumes:
      - sun-bun-cache:/root/.bun/install/cache
    commands:
      - bun install --frozen-lockfile --no-progress
      - bun run build

  build-backend:
    image: eclipse-temurin:25-jdk
    volumes:
      - sun-gradle-cache:/root/.gradle
    commands:
      - ./components/sun-graphql/gradlew -p components :sun-graphql:bootJar --no-daemon --build-cache

  deploy:
    image: sun-ci:1
    volumes:
      - /opt/woodpecker/keys/ci-deploy:/root/.ssh/ci-deploy:ro
      - /opt/woodpecker/keys/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      SSH_KEY: /root/.ssh/ci-deploy
    commands:
      - printf 'Host *\n  BatchMode yes\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - ./vm/vps/deploy-sun.sh all --skip-build
      - ./vm/nginx/install.sh

  provision-vms:
    image: sun-ci:1
    volumes:
      - /opt/woodpecker/keys/ci-deploy:/root/.ssh/ci-deploy:ro
      - /opt/woodpecker/keys/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      SSH_KEY: /root/.ssh/ci-deploy
    commands:
      - printf 'Host *\n  BatchMode yes\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - ./vm/vps/vps.sh provision
    when:
      - event: push
        branch: main
        path:
          - vm/vps/vps.sh
          - vm/vps/containers.conf
          - vm/vps/files/**
      - event: manual
        branch: main
