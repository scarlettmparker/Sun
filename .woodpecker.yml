when:
  - event: [push, manual]
    branch: main

steps:
  build-frontend:
    image: oven/bun:1.4.3
    volumes:
      - sun-bun-cache:/root/.bun/install/cache
    commands:
      - bun install --frozen-lockfile --no-progress
      - bun run build

  build-backend:
    image: gradle:8.14-jdk21
    volumes:
      - sun-gradle-cache:/home/gradle/.gradle
    commands:
      - ./components/sun-graphql/gradlew -p components :sun-graphql:bootJar --no-daemon --build-cache

  deploy:
    image: alpine:3.21
    volumes:
      - /opt/woodpecker/keys/ci-deploy:/root/.ssh/ci-deploy:ro
      - /opt/woodpecker/keys/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      SSH_KEY: /root/.ssh/ci-deploy
    commands:
      - apk add --no-cache openssh-client rsync bash curl file
      - printf 'Host *\n  BatchMode yes\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - ./deploy.sh all --skip-build
